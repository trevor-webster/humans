<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V-Book Table</title>
  <style>
    :root { --bg: #f7f4ec; --ink: #191919; --muted: #5a574f; --line: #ddd3c2; --accent: #7b2f1a; --card: #fffdf9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
    main { max-width: 100%; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { margin: 0 0 10px; line-height: 1.12; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .back { margin-bottom: 16px; }
    .lead { margin-top: 10px; max-width: 1100px; }
    .table-scroll { overflow-x: auto; margin-top: 28px; padding-bottom: 8px; }
    .matrix { display: grid; grid-template-columns: 170px repeat(10, 320px); gap: 12px; align-items: start; min-width: max-content; }
    .head, .row-head, .cell { border: 1px solid var(--line); background: var(--card); }
    .head, .row-head { padding: 12px 14px; }
    .head { text-align: center; font-weight: 700; }
    .row-head { font-weight: 700; color: var(--accent); }
    .cell { padding: 10px; }
    .missing { min-height: 240px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 18px; background: #fffaf2; }
    .frame-wrap { position: relative; width: 100%; overflow: hidden; background: white; min-height: 220px; }
    .frame-wrap iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: top left; background: white; }
    .meta { margin-top: 8px; font-size: 0.86rem; }
  </style>
</head>
<body>
  <main>
    <p class="back"><a href="./index.html">Back to v-book slices</a></p>
    <h1 id="title">V-Book Table</h1>
    <p class="lead" id="lead">Fixed <code>alpha = 1/3</code>. Rows are <code>1g</code>, <code>2g</code>, and <code>3g</code>; columns are the other 9 books plus Wikipedia.</p>
    <section class="table-scroll">
      <div class="matrix" id="matrix"></div>
    </section>
  </main>
  <script>
    const alpha = "1-3";
    const books = [
      { slug: "better-angels", label: "Better Angels" },
      { slug: "case-for-god", label: "Case for God" },
      { slug: "catching-fire", label: "Catching Fire" },
      { slug: "code-economy", label: "Code Economy" },
      { slug: "dawn-of-everything", label: "Dawn of Everything" },
      { slug: "guns-germs-and-steel", label: "Guns, Germs, and Steel" },
      { slug: "hierarchy-in-the-forest", label: "Hierarchy in the Forest" },
      { slug: "how-compassion-made-us-human", label: "How Compassion Made Us Human" },
      { slug: "sapiens", label: "Sapiens" },
      { slug: "ultrasociety", label: "Ultrasociety" }
    ];
    const rows = [
      { dir: "1grams", gram: "1g" },
      { dir: "2grams", gram: "2g" },
      { dir: "3grams", gram: "3g" }
    ];
    const fallbackWidth = 760;
    const fallbackHeight = 1500;
    const params = new URLSearchParams(window.location.search);
    const focusSlug = params.get("focus") || "sapiens";
    const focusBook = books.find((book) => book.slug === focusSlug) || books.find((book) => book.slug === "sapiens");
    const columns = books.filter((book) => book.slug !== focusBook.slug).concat([{ slug: "wiki", label: "Wikipedia" }]);

    document.title = `V ${focusBook.label}`;
    document.getElementById("title").textContent = `V ${focusBook.label}`;
    document.getElementById("lead").innerHTML = `Fixed <code>alpha = 1/3</code>. Rows are <code>1g</code>, <code>2g</code>, and <code>3g</code>; columns are the other 9 books plus Wikipedia, with ${focusBook.label} as the focus book.`;

    function sourcePath(column, row) {
      if (column.slug === "wiki") {
        if (row.gram === "1g") return `../1grams/wiki-v/v-book/wikitext103-v-${focusBook.slug}.alpha-${alpha}.html`;
        if (row.gram === "2g") return `../2grams/wiki-v/v-book/wikitext2-2grams-v-${focusBook.slug}.alpha-${alpha}.html`;
        return `../3grams/wiki-v/v-book/wikitext-2-raw-v1-3grams-v-${focusBook.slug}.alpha-${alpha}.html`;
      }
      return `../${row.dir}/v-book/${column.slug}-v-${focusBook.slug}.alpha-${alpha}.html`;
    }

    function fitCell(wrapper) {
      const iframe = wrapper.querySelector("iframe");
      if (!iframe) return;
      const intrinsicWidth = Number(iframe.dataset.intrinsicWidth || fallbackWidth);
      const intrinsicHeight = Number(iframe.dataset.intrinsicHeight || fallbackHeight);
      const scale = wrapper.clientWidth / intrinsicWidth;
      iframe.style.width = `${intrinsicWidth}px`;
      iframe.style.height = `${intrinsicHeight}px`;
      iframe.style.transform = `scale(${scale})`;
      wrapper.style.height = `${intrinsicHeight * scale}px`;
    }

    function prepareFrame(iframe) {
      try {
        const doc = iframe.contentDocument;
        if (!doc) return;
        const body = doc.body;
        const dashboard = doc.getElementById("allotaxonometer-dashboard");
        if (!body || !dashboard) return;
        body.style.margin = "0";
        body.style.padding = "0";
        body.style.background = "transparent";
        body.style.overflow = "hidden";
        doc.documentElement.style.background = "transparent";
        doc.documentElement.style.overflow = "hidden";
        iframe.dataset.intrinsicWidth = String(Math.max(doc.documentElement.scrollWidth || 0, body.scrollWidth || 0, dashboard.scrollWidth || 0, fallbackWidth));
        iframe.dataset.intrinsicHeight = String(Math.max(doc.documentElement.scrollHeight || 0, body.scrollHeight || 0, dashboard.scrollHeight || 0, fallbackHeight));
      } catch (error) {
        console.warn("Could not prepare iframe", error);
      }
      fitCell(iframe.parentElement);
    }

    const matrix = document.getElementById("matrix");
    const corner = document.createElement("div");
    corner.className = "head";
    corner.innerHTML = "<strong>n-gram \\\\ comparison</strong>";
    matrix.appendChild(corner);
    for (const column of columns) {
      const head = document.createElement("div");
      head.className = "head";
      head.textContent = column.label;
      matrix.appendChild(head);
    }

    for (const row of rows) {
      const rowHead = document.createElement("div");
      rowHead.className = "row-head";
      rowHead.textContent = row.gram;
      matrix.appendChild(rowHead);

      for (const column of columns) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const wrap = document.createElement("div");
        wrap.className = "frame-wrap";
        const iframe = document.createElement("iframe");
        iframe.loading = "lazy";
        iframe.scrolling = "no";
        iframe.src = sourcePath(column, row);
        iframe.title = `${column.label} v ${focusBook.label} ${row.gram}`;
        iframe.addEventListener("load", () => prepareFrame(iframe));
        iframe.addEventListener("error", () => {
          cell.innerHTML = `<div class="missing">Missing source HTML<br><span class="meta">${column.label} v ${focusBook.label}, ${row.gram}, alpha = 1/3</span></div>`;
        });
        wrap.appendChild(iframe);
        cell.appendChild(wrap);
        matrix.appendChild(cell);
      }
    }

    window.addEventListener("resize", () => document.querySelectorAll(".frame-wrap").forEach(fitCell));
  </script>
</body>
</html>
