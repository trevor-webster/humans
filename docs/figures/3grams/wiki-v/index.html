<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3g Wiki-v-Book Index</title>
  <style>
    :root { --bg: #f7f4ec; --ink: #191919; --muted: #5a574f; --line: #ddd3c2; --accent: #7b2f1a; --card: #fffdf9; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 64px; }
    h1, h2 { margin: 0 0 10px; line-height: 1.12; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .lead { margin-top: 10px; max-width: 780px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: 28px; }
    .card { display: block; border: 1px solid var(--line); background: var(--card); padding: 16px 18px; color: inherit; text-decoration: none; }
    .card:hover { border-color: var(--accent); }
    .eyebrow { color: var(--accent); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>3g Wiki-v-Book Index</h1>
    <p class="lead">WikiText reference comparisons against book corpora.</p>
    <section class="grid">
      <a class="card" href="./v-book/">
        <div class="eyebrow">Wiki v Book</div>
        <h2>3g Wiki-v-Book Alpha 0</h2>
        <p>Open the alpha = 0 wiki-v-book dashboard list.</p>
      </a>
    </section>
  </main>
</body>
</html>
